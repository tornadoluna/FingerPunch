[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerpunch"
version = "0.1.0"
description = "A typing practice application that trains optimal finger placement"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PySide6==6.10.2",
    "matplotlib==3.11.2",
    "opencv-python==5.0.0.93",
]

[project.scripts]
fingerpunch = "fingerpunch.__main__:main"

[tool.setuptools.packages.find]
include = ["fingerpunch*"]

[tool.ruff.lint]
ignore = ["DTZ005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
